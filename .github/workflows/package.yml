name: Paquet de l'application

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Une seule publication à la fois sur main, dans l'ordre des push.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Assemblage
        id: build
        run: |
          BUILD_DATE="$(TZ=Europe/Paris date '+%Y-%m-%d %H:%M:%S %Z')"
          ZIP_NAME="$(BUILD_DATE="$BUILD_DATE" ./scripts/package.sh)"
          echo "date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$(TZ=Europe/Paris date '+%Y.%m.%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      # L'artefact téléchargé depuis GitHub est un zip contenant directement
      # index.html, css/, js/… (le contenu de dist/ est placé à la racine).
      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: virtualpunaise
          path: dist/
          if-no-files-found: error

      # Chaque modification de main est publiée sous forme de release.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          ZIP: ${{ steps.build.outputs.zip }}
          BUILD_DATE: ${{ steps.build.outputs.date }}
        run: |
          gh release create "$TAG" "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "VirtualPunaise du $BUILD_DATE" \
            --notes "Application générée le $BUILD_DATE à partir du commit ${GITHUB_SHA::7}. Décompresser le zip puis servir le dossier (voir README)." \
            --latest
